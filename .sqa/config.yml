config:
  credentials: []
  project_repos:
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: release/2.2.1
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
    github.com/jkomijani/normflow_:
      branch: tests
      repo: https://github.com/jkomijani/normflow_
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      github.com/jkomijani/normflow_ git:
        commands:
        - /usr/bin/env sh .sqa/script.greasy-plum-mist.sh
        container: qc.acc_randy-seashell-abyssinian
  QC.Doc:
    repos:
      github.com/jkomijani/normflow_ find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.sleazy-ecru-ragdoll.sh
        container: qc.doc_woozy-rust-chamois
      github.com/jkomijani/normflow_ git:
        commands:
        - /usr/bin/env sh .sqa/script.scaly-magnolia-dugong.sh
        container: qc.doc_chummy-ochre-clam
      github.com/jkomijani/normflow_ markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.smelly-celadon-gecko.sh
        container: qc.doc_flaky-bistre-tarsier
  QC.Lic:
    repos:
      github.com/jkomijani/normflow_ licensee:
        commands:
        - /usr/bin/env sh .sqa/script.squeaky-cerulean-rhinoceros.sh
        container: qc.lic_paltry-champagne-guppy
  QC.Met:
    repos:
      github.com/jkomijani/normflow_ cff-converter-python:
        commands:
        - /usr/bin/env sh .sqa/script.crabby-tangerine-macaque.sh
        container: qc.met_shaggy-rust-bracke
  QC.Sec:
    repos:
      github.com/jkomijani/normflow_ bandit:
        commands:
        - /usr/bin/env sh .sqa/script.trippy-amethyst-armadillo.sh
        container: qc.sec_cloudy-green-dollar
  QC.Sty:
    repos:
      github.com/jkomijani/normflow_ flake8:
        commands:
        - /usr/bin/env sh .sqa/script.grumpy-flax-molly.sh
        container: qc.sty_muzzy-cyan-centipede
  QC.Uni:
    repos:
      github.com/jkomijani/normflow_ pytest:
        commands:
        - /usr/bin/env sh .sqa/script.hilly-ultramarine-horse.sh
        container: qc.uni_gummy-champagne-tortoise
  QC.Ver:
    repos:
      github.com/jkomijani/normflow_ get_git_tags.py:
        commands:
        - /usr/bin/env sh .sqa/script.droopy-tomato-javanese.sh
        container: qc.ver_dorky-violet-moth
timeout: 5400
