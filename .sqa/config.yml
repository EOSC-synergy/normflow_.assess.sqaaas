config:
  credentials: []
  project_repos:
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: release/2.2.1
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
    github.com/jkomijani/normflow_:
      branch: normflow_public_v1.1
      repo: https://github.com/jkomijani/normflow_
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      github.com/jkomijani/normflow_ git:
        commands:
        - /usr/bin/env sh .sqa/script.skanky-brass-rat.sh
        container: qc.acc_hilly-razzmatazz-tapir
  QC.Doc:
    repos:
      github.com/jkomijani/normflow_ find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.beady-buff-uguisu.sh
        container: qc.doc_stealthy-ultramarine-bulldog
      github.com/jkomijani/normflow_ git:
        commands:
        - /usr/bin/env sh .sqa/script.paltry-mauve-spitz.sh
        container: qc.doc_baggy-eggplant-mole
      github.com/jkomijani/normflow_ markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.foggy-chocolate-mandrill.sh
        container: qc.doc_whiny-thistle-dachsbracke
  QC.Lic:
    repos:
      github.com/jkomijani/normflow_ licensee:
        commands:
        - /usr/bin/env sh .sqa/script.whiny-bistre-beagle.sh
        container: qc.lic_shaggy-red-otter
  QC.Met:
    repos:
      github.com/jkomijani/normflow_ cff-converter-python:
        commands:
        - /usr/bin/env sh .sqa/script.nerdy-beige-binturong.sh
        container: qc.met_gloppy-lavender-markhor
  QC.Sec:
    repos:
      github.com/jkomijani/normflow_ bandit:
        commands:
        - /usr/bin/env sh .sqa/script.crappy-dandelion-chinook.sh
        container: qc.sec_nerdy-sepia-dollar
  QC.Sty:
    repos:
      github.com/jkomijani/normflow_ flake8:
        commands:
        - /usr/bin/env sh .sqa/script.sloppy-violet-impala.sh
        container: qc.sty_stealthy-ecru-antelope
  QC.Uni:
    repos:
      github.com/jkomijani/normflow_ pytest:
        commands:
        - /usr/bin/env sh .sqa/script.snippy-fuchsia-stoat.sh
        container: qc.uni_snazzy-brass-armadillo
  QC.Ver:
    repos:
      github.com/jkomijani/normflow_ get_git_tags.py:
        commands:
        - /usr/bin/env sh .sqa/script.tasty-amber-armadillo.sh
        container: qc.ver_skimpy-celadon-catfish
timeout: 5400
