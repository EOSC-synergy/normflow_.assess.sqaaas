config:
  credentials: []
  project_repos:
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: release/2.2.1
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
    github.com/jkomijani/normflow_:
      branch: normflow_public_v1.1
      repo: https://github.com/jkomijani/normflow_
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      github.com/jkomijani/normflow_ git:
        commands:
        - /usr/bin/env sh .sqa/script.craggy-corn-panda.sh
        container: qc.acc_hasty-malachite-dogfish
  QC.Doc:
    repos:
      github.com/jkomijani/normflow_ find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.geeky-lilac-okapi.sh
        container: qc.doc_muzzy-linen-hound
      github.com/jkomijani/normflow_ git:
        commands:
        - /usr/bin/env sh .sqa/script.squirrely-dandelion-grouse.sh
        container: qc.doc_trippy-dandelion-quokka
      github.com/jkomijani/normflow_ markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.craggy-puce-ladybird.sh
        container: qc.doc_skanky-cardinal-maltese
  QC.Lic:
    repos:
      github.com/jkomijani/normflow_ licensee:
        commands:
        - /usr/bin/env sh .sqa/script.cheeky-zucchini-manatee.sh
        container: qc.lic_slimy-cinnabar-seal
  QC.Met:
    repos:
      github.com/jkomijani/normflow_ cff-converter-python:
        commands:
        - /usr/bin/env sh .sqa/script.skinny-peach-labradoodle.sh
        container: qc.met_stuffy-lemon-ray
  QC.Sec:
    repos:
      github.com/jkomijani/normflow_ bandit:
        commands:
        - /usr/bin/env sh .sqa/script.lousy-ruby-akita.sh
        container: qc.sec_flimsy-white-heron
  QC.Sty:
    repos:
      github.com/jkomijani/normflow_ flake8:
        commands:
        - /usr/bin/env sh .sqa/script.wiggy-ochre-foxhound.sh
        container: qc.sty_randy-khaki-cuscus
  QC.Uni:
    repos:
      github.com/jkomijani/normflow_ pytest:
        commands:
        - /usr/bin/env sh .sqa/script.lanky-wisteria-mayfly.sh
        container: qc.uni_cloudy-khaki-bee
  QC.Ver:
    repos:
      github.com/jkomijani/normflow_ get_git_tags.py:
        commands:
        - /usr/bin/env sh .sqa/script.shabby-teal-forest.sh
        container: qc.ver_scanty-dandelion-olm
timeout: 5400
