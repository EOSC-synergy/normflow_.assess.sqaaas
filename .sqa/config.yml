config:
  credentials: []
  project_repos:
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: release/2.2.1
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
    github.com/jkomijani/normflow_:
      branch: normflow_public_v1.1
      repo: https://github.com/jkomijani/normflow_
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      github.com/jkomijani/normflow_ git:
        commands:
        - /usr/bin/env sh .sqa/script.sleepy-blue-bison.sh
        container: qc.acc_geeky-puce-crane
  QC.Doc:
    repos:
      github.com/jkomijani/normflow_ find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.flabby-firebrick-eel.sh
        container: qc.doc_sunny-cream-koala
      github.com/jkomijani/normflow_ git:
        commands:
        - /usr/bin/env sh .sqa/script.silly-rose-caterpillar.sh
        container: qc.doc_shaky-cornflower-vulture
      github.com/jkomijani/normflow_ markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.woozy-chartreuse-bee.sh
        container: qc.doc_skanky-asparagus-dolphin
  QC.Lic:
    repos:
      github.com/jkomijani/normflow_ licensee:
        commands:
        - /usr/bin/env sh .sqa/script.gamy-cyan-harrier.sh
        container: qc.lic_stinky-charcoal-newfoundland
