config:
  credentials: []
  project_repos:
    github.com/EOSC-Synergy-SQAaaS/normflow_:
      branch: snapshots
      repo: https://github.com/EOSC-Synergy-SQAaaS/normflow_
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: release/2.2.1
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      github.com/EOSC-Synergy-SQAaaS/normflow_ git:
        commands:
        - /usr/bin/env sh .sqa/script.cozy-persimmon-orangutan.sh
        container: qc.acc_geeky-wheat-beagle
  QC.Doc:
    repos:
      github.com/EOSC-Synergy-SQAaaS/normflow_ find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.snippy-platinum-whippet.sh
        container: qc.doc_sloppy-corn-argentino
      github.com/EOSC-Synergy-SQAaaS/normflow_ git:
        commands:
        - /usr/bin/env sh .sqa/script.ready-black-cassowary.sh
        container: qc.doc_ready-green-leopard
      github.com/EOSC-Synergy-SQAaaS/normflow_ markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.muggy-cobalt-toad.sh
        container: qc.doc_breezy-russet-tiger
      github.com/EOSC-Synergy-SQAaaS/normflow_ restructuredtext-lint:
        commands:
        - /usr/bin/env sh .sqa/script.squirrely-celadon-woodpecker.sh
        container: qc.doc_sleazy-emerald-budgerigar
  QC.Lic:
    repos:
      github.com/EOSC-Synergy-SQAaaS/normflow_ licensee:
        commands:
        - /usr/bin/env sh .sqa/script.cozy-charcoal-budgerigar.sh
        container: qc.lic_lovely-myrtle-sparrow
  QC.Met:
    repos:
      github.com/EOSC-Synergy-SQAaaS/normflow_ cff-converter-python:
        commands:
        - /usr/bin/env sh .sqa/script.blurry-buff-octopus.sh
        container: qc.met_squirrely-smalt-lobster
  QC.Sec:
    repos:
      github.com/EOSC-Synergy-SQAaaS/normflow_ bandit:
        commands:
        - /usr/bin/env sh .sqa/script.silly-malachite-leopard.sh
        container: qc.sec_bumpy-ivory-macaque
  QC.Sty:
    repos:
      github.com/EOSC-Synergy-SQAaaS/normflow_ flake8:
        commands:
        - /usr/bin/env sh .sqa/script.craggy-rust-hummingbird.sh
        container: qc.sty_muggy-ecru-crab
  QC.Uni:
    repos:
      github.com/EOSC-Synergy-SQAaaS/normflow_ pytest:
        commands:
        - /usr/bin/env sh .sqa/script.trippy-smalt-millipede.sh
        container: qc.uni_wimpy-turquoise-worm
  QC.Ver:
    repos:
      github.com/EOSC-Synergy-SQAaaS/normflow_ get_git_tags.py:
        commands:
        - /usr/bin/env sh .sqa/script.zippy-eggplant-kudu.sh
        container: qc.ver_nerdy-yellow-hummingbird
timeout: 5400
