      github.com/jkomijani/normflow_ bandit:
        commands:
        - /usr/bin/env sh .sqa/script.scanty-ultramarine-giraffe.sh
        container: qc.sec_wimpy-flax-akita
  QC.Sty:
    repos:
      github.com/jkomijani/normflow_ flake8:
        commands:
        - /usr/bin/env sh .sqa/script.cozy-tan-bat.sh
        container: qc.sty_pretty-burgundy-woodpecker
  QC.Uni:
    repos:
      github.com/jkomijani/normflow_ pytest:
        commands:
        - /usr/bin/env sh .sqa/script.shaggy-amethyst-akbash.sh
        container: qc.uni_cloudy-malachite-chameleon
