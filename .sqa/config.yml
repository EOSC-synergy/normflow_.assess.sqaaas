config:
  credentials: []
  project_repos:
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: release/2.2.1
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
    github.com/jkomijani/normflow_:
      branch: normflow_public_v1.1
      repo: https://github.com/jkomijani/normflow_
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      github.com/jkomijani/normflow_ git:
        commands:
        - /usr/bin/env sh .sqa/script.silly-copper-boar.sh
        container: qc.acc_goopy-amaranth-wolf
  QC.Doc:
    repos:
      github.com/jkomijani/normflow_ find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.wiggy-pumpkin-bombay.sh
        container: qc.doc_chummy-lemon-catfish
      github.com/jkomijani/normflow_ git:
        commands:
        - /usr/bin/env sh .sqa/script.woolly-eggplant-dormouse.sh
        container: qc.doc_shabby-cardinal-dalmatian
      github.com/jkomijani/normflow_ markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.gamy-mauve-grasshopper.sh
        container: qc.doc_cheeky-maroon-duck
  QC.Lic:
    repos:
      github.com/jkomijani/normflow_ licensee:
        commands:
        - /usr/bin/env sh .sqa/script.boozy-crimson-emu.sh
        container: qc.lic_tasty-magnolia-mayfly
  QC.Met:
    repos:
      github.com/jkomijani/normflow_ cff-converter-python:
        commands:
        - /usr/bin/env sh .sqa/script.squeaky-charcoal-dane.sh
        container: qc.met_lanky-grey-wombat
  QC.Sec:
    repos:
      github.com/jkomijani/normflow_ bandit:
        commands:
        - /usr/bin/env sh .sqa/script.gimpy-amethyst-raccoon.sh
        container: qc.sec_bumpy-dandelion-dachsbracke
  QC.Sty:
    repos:
      github.com/jkomijani/normflow_ flake8:
        commands:
        - /usr/bin/env sh .sqa/script.tasty-mustard-guppy.sh
        container: qc.sty_slimy-myrtle-tang
  QC.Uni:
    repos:
      github.com/jkomijani/normflow_ pytest:
        commands:
        - /usr/bin/env sh .sqa/script.randy-lilac-dalmatian.sh
        container: qc.uni_trippy-taupe-butterfly
  QC.Ver:
    repos:
      github.com/jkomijani/normflow_ get_git_tags.py:
        commands:
        - /usr/bin/env sh .sqa/script.leaky-turquoise-bird.sh
        container: qc.ver_ugly-corn-starfish
timeout: 5400
